; PlatformIO Project Configuration File -- tesserae-device-firmware
;
; Multi-target Tesserae e-paper firmware: one codebase, one [env:...] per
; device. Each env selects a board (pin map + panel geometry + MCU tier +
; panel driver) via a -DTESSERAE_BOARD_* flag that boards/board.h dispatches
; on. The panel driver itself is bound at build time in src/panel/registry.c.
;
; Shared knobs live in [env] and are inherited by every target.

[env]
; Pinned to the pioarduino platform fork (ESP-IDF 5.5, ships the
; esp32-s3-devkitc1-n16r8 variant). The official registry "espressif32" does
; NOT carry that board, so this must be an explicit URL for reproducible CI.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct
; Ed25519 verification for signed OTA manifests. Pin the exact upstream commit
; behind Monocypher 4.0.3 so a moved tag cannot silently change the crypto code.
lib_deps =
    https://github.com/LoupVaillant/Monocypher.git#ab2b16dd619ad5f6979a4fbe69cfa324a6fcc35f
; sdkconfig.defaults at the project root is picked up automatically by the
; ESP-IDF integration; no extra path needed here.

; -----------------------------------------------------------------------
; Phase 0 target -- Waveshare ESP32-S3-ePaper-13.3E6
;   - Module: ESP32-S3-WROOM-2-N32R16V (32 MB flash, 16 MB octal PSRAM)
;   - Panel:  13.3" 1200x1600 6-color Spectra E6, dual-controller (CS_M/CS_S)
;   - Driver family A: spectra6_spi_dual
;
; Built against the n16r8 PlatformIO variant (16 MB flash, 8 MB octal PSRAM).
; That fits comfortably inside the real module's larger flash/PSRAM; if you
; later want OTA + dual app slots, bump board_build.flash_size to 32MB and
; widen the factory partition in partitions.csv.
; -----------------------------------------------------------------------
[env:waveshare-133e6]
board = esp32-s3-devkitc1-n16r8
board_build.cmake_extra_args = -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.ota.defaults"

; FW_VERSION (reported in the status heartbeat) is injected by CI as an
; auto-incrementing 0.0.<build> string -- see .github/workflows/firmware.yml.
; Local builds have no flag and fall back to "0.0.0-dev" (include/app_config.h).
build_flags =
    -DTESSERAE_BOARD_WAVESHARE_133E6
    -DTESSERAE_OTA_CAPABILITY_ENABLED=1

board_build.partitions = partitions_ota.csv
board_build.flash_size = 16MB

; -----------------------------------------------------------------------
; Phase 1 target -- Seeed reTerminal E1004
;   - MCU:   XIAO ESP32-S3 class (ESP32-S3 + PSRAM)
;   - Panel: 13.3" T133A01, dual-chip Spectra-6, 1200x1600
;   - Driver: spectra6_t133a01_dual (Family A variant; NOT the 13.3E6 blobs)
;
; Built against the same n16r8 S3+octal-PSRAM tier stand-in as the base (our
; pins come from boards/seeed_reterminal_e1004.h, not the PlatformIO board).
; Hardware inspection on a production E1004 found a 32 MB flash chip. This env
; therefore has an E1004-only A/B layout with two 4 MB OTA slots. Its explicit
; offsets keep the existing NVS partition at 0x9000 so a one-time USB migration
; can preserve WiFi credentials and device registration.
;
; The existing E1004 board/panel path is hardware-proven. The A/B migration was
; verified on a production unit with NVS preserved; rollback fault tests remain.
; -----------------------------------------------------------------------
[env:seeed-reterminal-e1004]
board = esp32-s3-devkitc1-n16r8
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.ble.defaults;sdkconfig.e1004-ota.defaults"

build_flags =
    -DTESSERAE_BOARD_SEEED_E1004
    -DTESSERAE_OTA_CAPABILITY_ENABLED=1

board_build.partitions = partitions_e1004_ota.csv
board_build.flash_size = 32MB
board_upload.flash_size = 32MB

; Driver-only bring-up build for the E1004: on boot, init the panel and paint
; the 6 colour bars, then halt -- no WiFi/MQTT. Flash this first to validate
; the (unverified) T133A01 driver in isolation before the full firmware.
[env:seeed-reterminal-e1004-selftest]
extends = env:seeed-reterminal-e1004
build_flags =
    ${env:seeed-reterminal-e1004.build_flags}
    -DEPD_SELFTEST

; -----------------------------------------------------------------------
; Seeed reTerminal E1002 -- single-controller Spectra-6, 800x480 (Family B)
;   - Driver: spectra6_spi_single (ESP-IDF Spectra-6 update path,
;     confirmed working on real E1002 hardware).
; Same S3 + octal-PSRAM tier stand-in; pins come from the board header.
; -----------------------------------------------------------------------
[env:seeed-reterminal-e1002]
board = esp32-s3-devkitc1-n16r8
board_build.cmake_extra_args = -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.ble.defaults;sdkconfig.ota.defaults"

build_flags =
    -DTESSERAE_BOARD_SEEED_E1002
    -DTESSERAE_OTA_CAPABILITY_ENABLED=1

board_build.partitions = partitions_ota.csv
board_build.flash_size = 16MB

; Driver-only bring-up (colour bars, no networking) -- flash this first.
[env:seeed-reterminal-e1002-selftest]
extends = env:seeed-reterminal-e1002
build_flags =
    ${env:seeed-reterminal-e1002.build_flags}
    -DEPD_SELFTEST

; -----------------------------------------------------------------------
; Seeed reTerminal E1001 -- 7.5" mono (black/white), 800x480 (Family C)
;   - Driver: mono_spi (UC8179-class EP75; 1bpp packed frame, 48000 bytes).
; Same S3 + octal-PSRAM tier stand-in; pins come from the board header.
; -----------------------------------------------------------------------
[env:seeed-reterminal-e1001]
board = esp32-s3-devkitc1-n16r8
board_build.cmake_extra_args = -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.ble.defaults;sdkconfig.ota.defaults"

build_flags =
    -DTESSERAE_BOARD_SEEED_E1001
    -DTESSERAE_OTA_CAPABILITY_ENABLED=1

board_build.partitions = partitions_ota.csv
board_build.flash_size = 16MB

; Driver-only bring-up (mono stripes, no networking) -- flash this first.
[env:seeed-reterminal-e1001-selftest]
extends = env:seeed-reterminal-e1001
build_flags =
    ${env:seeed-reterminal-e1001.build_flags}
    -DEPD_SELFTEST

; -----------------------------------------------------------------------
; Seeed reTerminal E1001 -- 4-level GRAYSCALE build (same hardware, new wire
; format: 2bpp packed, 96000 bytes; kind seeed_reterminal_e1001_gray).
;   - Driver: mono_spi in EPD_GRAY4 mode (register LUTs, dual-plane refresh).
; The mono 1bpp env above stays the default; gray is opt-in. The server
; auto-heals an existing E1001 registration to the gray kind on re-register/
; re-discover, so switching is just a reflash.
; UNVERIFIED on hardware: needs the bench gray-ramp pass (LUT tuning risk).
; -----------------------------------------------------------------------
[env:seeed-reterminal-e1001-gray]
board = esp32-s3-devkitc1-n16r8
board_build.cmake_extra_args = -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.ble.defaults;sdkconfig.ota.defaults"

build_flags =
    -DTESSERAE_BOARD_SEEED_E1001_GRAY
    -DTESSERAE_OTA_CAPABILITY_ENABLED=1

board_build.partitions = partitions_ota.csv
board_build.flash_size = 16MB

; -----------------------------------------------------------------------
; Seeed reTerminal E1001 -- 4-level grayscale, LEGACY-glass OTA lineage.
;
; DEPRECATED, and kept only so devices already on this kind keep getting
; updates. It is no longer a different firmware: mono_spi asks the panel which
; waveform it has (gray_probe_waveform) rather than being told at build time, so
; the gray env above covers both batches of this glass. Confirmed on a user's
; legacy panel 2026-08-20.
;
; DO NOT OFFER THIS IN THE FLASHER. New devices should take the gray env.
; Do not delete it either: kind is the OTA lineage and this one has shipped
; since v1.12.0, so removing the target silently strands any device keyed to it.
; Because the images now behave the same, a legacy-kind device that takes an OTA
; of this target picks up the probe and the corrected waveform on its own, so the
; migration needs nothing from the user. Retire the env, board header and catalog
; entry together once no device reports the kind.
;
; See boards/seeed_reterminal_e1001_gray_legacy.h for the one substantive
; difference that remains (the probe-failure fallback) and the server-side
; catalog entry this still needs.
; -----------------------------------------------------------------------
[env:seeed-reterminal-e1001-gray-legacy]
board = esp32-s3-devkitc1-n16r8
board_build.cmake_extra_args = -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.ble.defaults;sdkconfig.ota.defaults"

; No GRAY4_* overrides. The board header sets GRAY4_WAVEFORM_FALLBACK=0 so a
; failed probe lands on register LUTs -- the path this population is known to
; need -- and that is the whole of its configuration. The old tuning knobs are
; gone with the GoodDisplay tables they existed to rescue.
build_flags =
    -DTESSERAE_BOARD_SEEED_E1001_GRAY_LEGACY
    -DTESSERAE_OTA_CAPABILITY_ENABLED=1

board_build.partitions = partitions_ota.csv
board_build.flash_size = 16MB

; Driver-only bring-up: 4-band gray ramp (black/dark/light/white), no
; networking. Flash this first; even spacing between the two grays is the
; tuning target.
[env:seeed-reterminal-e1001-gray-selftest]
extends = env:seeed-reterminal-e1001-gray
build_flags =
    ${env:seeed-reterminal-e1001-gray.build_flags}
    -DEPD_SELFTEST

; Deck-cache bring-up (any SD-slot board env can adapt this): mounts the card,
; writes + reads back + digest-verifies a frame-sized file, reports free
; space over serial, then halts. No networking, no panel refresh.
[env:seeed-reterminal-e1001-sdtest]
extends = env:seeed-reterminal-e1001
build_flags =
    ${env:seeed-reterminal-e1001.build_flags}
    -DDECK_SD_SELFTEST

; -----------------------------------------------------------------------
; Seeed reTerminal Sticky -- 3.97" 800x480 4-level grayscale (Family E).
;
; NEW CONTROLLER FAMILY: SSD1677, an SSD16xx-class part. Not a UC8179 despite
; the identical geometry and wire format -- different command set, different
; init, and BUSY is active HIGH rather than LOW.
;
; The frame is the same 2bpp/96000-byte shape as the E1001 gray build, so no
; server-side renderer work was needed; it does need a hardware-catalog entry
; for kind seeed_reterminal_sticky (see the board header).
;
; UNVERIFIED ON HARDWARE. Pins are from Seeed's Sticky docs, sequences ported
; from Seeed_GFX. Flash the -selftest env first and judge the four grey bands.
; -----------------------------------------------------------------------
[env:seeed-reterminal-sticky]
board = esp32-s3-devkitc1-n16r8
board_build.cmake_extra_args = -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.ble.defaults;sdkconfig.ota.defaults"

build_flags =
    -DTESSERAE_BOARD_SEEED_STICKY
    -DTESSERAE_OTA_CAPABILITY_ENABLED=1

board_build.partitions = partitions_ota.csv
board_build.flash_size = 16MB

; Driver-only bring-up: 4-band grey ramp, no networking. Flash this first.
[env:seeed-reterminal-sticky-selftest]
extends = env:seeed-reterminal-sticky
build_flags =
    ${env:seeed-reterminal-sticky.build_flags}
    -DEPD_SELFTEST

; -----------------------------------------------------------------------
; Seeed reTerminal E1003 -- 10.3" ED103TC2 grayscale via IT8951 (Family D)
;   - Driver: it8951_gray (4bpp 16-level GC16; 1872x1404; 1.3 MB frame).
; Same S3 + octal-PSRAM tier stand-in; pins come from the board header.
; The reTerminal E1003's real flash is unconfirmed (reported 32 MB); the
; 4 MB-factory table fits, flash with --flash-size detect.
; -----------------------------------------------------------------------
[env:seeed-reterminal-e1003]
board = esp32-s3-devkitc1-n16r8
; TESSERAE_ICON_FONT gates the EMBED_FILES entry in src/CMakeLists.txt; it must
; be set on exactly the envs that also set board_build.embed_files below.
board_build.cmake_extra_args = -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.ble.defaults;sdkconfig.ota.defaults" -D TESSERAE_ICON_FONT=1

build_flags =
    -DTESSERAE_BOARD_SEEED_E1003
    -DTESSERAE_OTA_CAPABILITY_ENABLED=1
    ; Touch-v3 icons: bundle the pinned Phosphor bold weight (2.1.2) + the
    ; stb_truetype rasterizer, so button icons render locally from icon.name.
    ; Costs ~484 KB of flash for the font; drop this flag to fall back to
    ; label-only buttons (the `icons` capability then goes unadvertised).
    -DT3_HAVE_ICON_FONT

board_build.partitions = partitions_ota.csv
board_build.flash_size = 16MB

; Touch-v3 icon font, embedded as a binary blob (symbols
; _binary_Phosphor_Bold_ttf_start/_end, consumed by touch3_icons.c). Declared
; here rather than via CMake's EMBED_FILES because PlatformIO's IDF integration
; does not generate the assembly stub for the latter. Per-env by design: boards
; without icons never carry the font.
board_build.embed_files =
    src/fonts/Phosphor-Bold.ttf

; The E1003 module has a 32 MB Winbond flash on which esptool's stub loader
; fails at attach_flash ("chip stopped responding"); --no-stub flashes fine.
; Lives in the BASE env so every -selftest/-sdtest/-overlaytest child
; inherits it via extends.
upload_flags = --no-stub

; -----------------------------------------------------------------------
; E1003 bench-soak build: identical firmware, but it will not update itself.
;
; A bench build reports a version the server does not recognise as current, so
; the server offers it the latest release and the device installs it -- quietly
; replacing the build under test with shipped firmware, mid-soak, with nothing
; on the panel to say so. That happened during always-on bring-up: the moment
; the mbedTLS PSRAM fix let OTA reach the server, the E1003 pulled v1.16.4 over
; the top of the branch build twice in a row. Pinning the version does not stop
; it; the offer does not depend on the comparison going the way you expect.
;
; So this env withholds the OTA capability entirely (note it does NOT inherit
; the parent's build_flags, which is the whole point) and reports a sentinel
; version, making it obvious in the device list which unit is on a bench build.
;
; Use it for anything that has to survive on hardware for hours. Flash with
; --no-compress: this module's ROM loader fails intermittently on compressed
; writes to the app partition.
;
; DELIBERATELY ABSENT from the release.yml and firmware.yml matrices, and it
; must stay that way. It shares TESSERAE_DEVICE_KIND with the parent env, and
; release.yml stages each target's signing input as "<kind>.app.bin" into one
; directory -- so shipping both would have them overwrite each other, and the
; E1003 fleet could be handed a signed image with OTA compiled out. Adding a
; kind of its own would need a server catalog entry, which is far more than a
; bench build deserves. Keep it out of the matrices instead.
; -----------------------------------------------------------------------
[env:seeed-reterminal-e1003-soak]
extends = env:seeed-reterminal-e1003
build_flags =
    -DTESSERAE_BOARD_SEEED_E1003
    -DT3_HAVE_ICON_FONT
    -DFW_VERSION=\"99.0.0-bench\"

; Deck-cache bring-up: mount + write/read/digest-verify round trip. The
; E1003 is the one board where the SD card shares the IT8951's READ line
; (MISO GPIO8), so this also exercises bus coexistence. No networking.
[env:seeed-reterminal-e1003-sdtest]
extends = env:seeed-reterminal-e1003
build_flags =
    ${env:seeed-reterminal-e1003.build_flags}
    -DDECK_SD_SELFTEST

; Overlay bring-up: gray-band base + synthetic spec (invert target + digits
; slot) with DU partial refreshes and timings on serial. No networking.
[env:seeed-reterminal-e1003-overlaytest]
extends = env:seeed-reterminal-e1003
build_flags =
    ${env:seeed-reterminal-e1003.build_flags}
    -DOVERLAY_SELFTEST

; Touch-v3 bring-up: render all four device-drawn primitives (button, switch,
; slider, stepper) from a synthetic spec onto a blank frame, then exercise each
; interaction with DU partial refreshes and per-op timings on serial, followed
; by a 30 s live-tap orientation check. No networking -- this is the hardware
; validator while the server's Phase-1 v3 endpoints do not exist yet. Compare
; the glass against the server's canvas preview for WYSIWYG.
[env:seeed-reterminal-e1003-touch3test]
extends = env:seeed-reterminal-e1003
build_flags =
    ${env:seeed-reterminal-e1003.build_flags}
    -DTOUCH3_SELFTEST

; Driver-only bring-up (16-level gray ramp, no networking) -- flash this first.
[env:seeed-reterminal-e1003-selftest]
extends = env:seeed-reterminal-e1003
build_flags =
    ${env:seeed-reterminal-e1003.build_flags}
    -DEPD_SELFTEST

; -----------------------------------------------------------------------
; Waveshare ESP32-S3 PhotoPainter -- 7.3" single-controller Spectra-6 (Family B)
;   - Module: ESP32-S3-WROOM-1-N16R8 (16 MB flash, 8 MB octal PSRAM)
;   - Driver: spectra6_spi_single (shared with the E1002; the board header
;     turns on EPD_ROTATE_180 + BOARD_HAS_PMIC for this unit).
;   - Power:  AXP2101 PMIC over I2C (panel rails + battery); no ADC divider.
; Same S3 + octal-PSRAM tier; pins come from the board header.
; -----------------------------------------------------------------------
[env:waveshare-photopainter-73]
board = esp32-s3-devkitc1-n16r8
board_build.cmake_extra_args = -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.ota.defaults"

build_flags =
    -DTESSERAE_BOARD_WAVESHARE_PHOTOPAINTER_73
    -DTESSERAE_OTA_CAPABILITY_ENABLED=1

board_build.partitions = partitions_ota.csv
board_build.flash_size = 16MB

; Driver-only bring-up (colour bars, no networking) -- flash this first.
[env:waveshare-photopainter-73-selftest]
extends = env:waveshare-photopainter-73
build_flags =
    ${env:waveshare-photopainter-73.build_flags}
    -DEPD_SELFTEST

; Deck-cache bring-up: SDMMC 1-bit mount (AXP2101 rails raised first) +
; write/read/digest-verify round trip over serial. No networking, no panel.
[env:waveshare-photopainter-73-sdtest]
extends = env:waveshare-photopainter-73
build_flags =
    ${env:waveshare-photopainter-73.build_flags}
    -DDECK_SD_SELFTEST

; -----------------------------------------------------------------------
; Seeed XIAO ePaper Driver Board EE02 -- 13.3" T133A01 dual Spectra-6 (Family A)
;   - Module: XIAO ESP32-S3 Plus (native USB, no CH340)
;   - Driver: spectra6_t133a01_dual (SHARED with the E1004; same T133A01 panel).
;     Only the pin map differs (from Seeed_GFX EE02 setup).
; The EE02 wires CS_M=GPIO44 / EN=GPIO43, which are UART0 TX/RX, so this env
; uses sdkconfig.ee02.defaults (console -> USB-Serial-JTAG) to free UART0.
; -----------------------------------------------------------------------
[env:seeed-ee02]
board = esp32-s3-devkitc1-n16r8
board_build.cmake_extra_args = -D SDKCONFIG_DEFAULTS="sdkconfig.usbjtag.defaults;sdkconfig.ble.defaults;sdkconfig.ota.defaults"

build_flags =
    -DTESSERAE_BOARD_SEEED_EE02
    -DTESSERAE_OTA_CAPABILITY_ENABLED=1

board_build.partitions = partitions_ota.csv
board_build.flash_size = 16MB

; Driver-only bring-up (colour bars, no networking) -- flash this first.
[env:seeed-ee02-selftest]
extends = env:seeed-ee02
build_flags =
    ${env:seeed-ee02.build_flags}
    -DEPD_SELFTEST

; -----------------------------------------------------------------------
; Seeed XIAO ePaper 7.5" mono -- the panel in the TRMNL 7.5" OG DIY kit (Family C)
;   - Module: XIAO ESP32-S3 Plus (native USB, no CH340)
;   - Driver: mono_spi (SHARED with the E1001; same 800x480 1bpp mono panel).
;     Only the pin map differs (Seeed_GFX USE_XIAO_EPAPER_DRIVER_BOARD).
; Native-USB board -> console over USB-Serial-JTAG (sdkconfig.usbjtag.defaults).
; -----------------------------------------------------------------------
[env:xiao-epaper-75]
board = esp32-s3-devkitc1-n16r8
board_build.cmake_extra_args = -D SDKCONFIG_DEFAULTS="sdkconfig.usbjtag.defaults;sdkconfig.ota.defaults"

build_flags =
    -DTESSERAE_BOARD_XIAO_EPAPER_75
    -DTESSERAE_OTA_CAPABILITY_ENABLED=1

board_build.partitions = partitions_ota.csv
board_build.flash_size = 16MB

; -----------------------------------------------------------------------
; Seeed XIAO 7.5" ePaper Panel -- the INTEGRATED C3 product, NOT the S3 kit
; above. Different MCU, different driver board, different pin map; see
; boards/seeed_xiao_epaper_75_c3.h. 4 MB flash and no PSRAM, so it needs its
; own sdkconfig base and its own A/B table (1.9 MiB slots, not 4 MiB).
; UNVERIFIED ON HARDWARE.
; -----------------------------------------------------------------------
[env:xiao-epaper-75-c3]
board = seeed_xiao_esp32c3
board_build.cmake_extra_args = -D SDKCONFIG_DEFAULTS="sdkconfig.c3.defaults;sdkconfig.ota.defaults"

build_flags =
    -DTESSERAE_BOARD_XIAO_EPAPER_75_C3
    -DTESSERAE_OTA_CAPABILITY_ENABLED=1

board_build.partitions = partitions_c3_ota.csv
board_build.flash_size = 4MB

; Driver-only bring-up (mono stripes, no networking) -- flash this first.
[env:xiao-epaper-75-selftest]
extends = env:xiao-epaper-75
build_flags =
    ${env:xiao-epaper-75.build_flags}
    -DEPD_SELFTEST

; -----------------------------------------------------------------------
; XIAO ePaper driver board + 7.5" BLACK/WHITE/RED panel (DKE DEPG0750RW /
; GoodDisplay GDEW075Z08 class -- the tri-color sibling of the TRMNL kit's
; mono glass, often sold on AliExpress as a plain "7.5 inch" panel).
;   - Driver: mono_spi in EPD_BWR mode (KWR OTP waveform, DTM1=B/W DTM2=red).
;   - Wire format: 2bpp packed, 96000 B (0=black 1=white 2=red); new kind
;     xiao_epaper_75_bwr needs a server-side renderer.
; Full refresh is ~17 s of flashing -- normal for tri-color glass.
; UNVERIFIED on hardware: community bring-up target (flash -selftest first;
; expect bands black/white/RED/white top to bottom).
; -----------------------------------------------------------------------
[env:xiao-epaper-75-bwr]
board = esp32-s3-devkitc1-n16r8
board_build.cmake_extra_args = -D SDKCONFIG_DEFAULTS="sdkconfig.usbjtag.defaults;sdkconfig.ota.defaults"

build_flags =
    -DTESSERAE_BOARD_XIAO_EPAPER_75_BWR
    -DTESSERAE_OTA_CAPABILITY_ENABLED=1

board_build.partitions = partitions_ota.csv
board_build.flash_size = 16MB

; Driver-only bring-up: black/white/RED/white bands, no networking. The band
; order on glass confirms the plane mapping (reference code has lied to us
; about this panel family before -- see the E1001 4-gray bench notes).
[env:xiao-epaper-75-bwr-selftest]
extends = env:xiao-epaper-75-bwr
build_flags =
    ${env:xiao-epaper-75-bwr.build_flags}
    -DEPD_SELFTEST

; -----------------------------------------------------------------------
; Seeed XIAO ePaper Display Board EE04 -- 7.5" mono, 24-pin FPC (Family C)
;   - Module: XIAO ESP32-S3 Plus (native USB, no CH340)
;   - Driver: mono_spi (SHARED with the E1001 / xiao-epaper-75; same 800x480
;     1bpp mono panel). Pin map is the single-CS subset of the EE02's.
; The EE04 also takes a 50-pin 7.3" Spectra-6 panel -- that's the separate
; seeed-ee04-73e6 env below; pick the env matching the attached panel and set
; the board's jumper caps to match (24-pin here).
; CS=GPIO44 / EN=GPIO43 are UART0 pins -> console on USB-Serial-JTAG.
; UNVERIFIED on hardware: community bring-up target (flash the selftest first).
; -----------------------------------------------------------------------
[env:seeed-ee04-75]
board = esp32-s3-devkitc1-n16r8
board_build.cmake_extra_args = -D SDKCONFIG_DEFAULTS="sdkconfig.usbjtag.defaults;sdkconfig.ble.defaults;sdkconfig.ota.defaults"

build_flags =
    -DTESSERAE_BOARD_SEEED_EE04_75
    -DTESSERAE_OTA_CAPABILITY_ENABLED=1

board_build.partitions = partitions_ota.csv
board_build.flash_size = 16MB

; Driver-only bring-up (mono stripes, no networking) -- flash this first.
[env:seeed-ee04-75-selftest]
extends = env:seeed-ee04-75
build_flags =
    ${env:seeed-ee04-75.build_flags}
    -DEPD_SELFTEST

; -----------------------------------------------------------------------
; Seeed XIAO ePaper Display Board EE04 -- 7.3" Spectra-6, 50-pin FPC (Family B)
;   - Module: XIAO ESP32-S3 Plus (native USB, no CH340)
;   - Driver: spectra6_spi_single (SHARED with the E1002 / PhotoPainter 7.3;
;     same 800x480 single-controller Spectra-6 panel).
; Same board as seeed-ee04-75; jumper caps must be in the 50-pin position.
; CS=GPIO44 / EN=GPIO43 are UART0 pins -> console on USB-Serial-JTAG.
; UNVERIFIED on hardware: community bring-up target (flash the selftest first).
; -----------------------------------------------------------------------
