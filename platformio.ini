; -----------------------------------------------------------------------
; Seeed XIAO ePaper Display Board EE05 -- 2.13" quadruple-colour BWRY,
; 24-pin FPC (JD79676, 122x250 visible on a 128x250 stride)
;   - Module: XIAO ESP32-S3 Plus (native USB, no CH340)
;   - Driver: jd79676_bwry (NEW: single 2bpp indexed buffer, not the BWR
;     dual-plane path). Pin map is byte-for-byte the EE04 single-CS map.
; CS=GPIO44 / EN=GPIO43 are UART0 pins -> console on USB-Serial-JTAG.
; UNVERIFIED on hardware: issue #29 bring-up target. Flash the selftest
; first -- its pattern also settles which edge hides the 6 dead columns
; and the colour order (photo + serial log wanted on the issue).
; -----------------------------------------------------------------------
[env:seeed-ee05]
board = esp32-s3-devkitc1-n16r8
board_build.cmake_extra_args = -D SDKCONFIG_DEFAULTS="sdkconfig.usbjtag.defaults;sdkconfig.ble.defaults;sdkconfig.ota.defaults"

build_flags =
    -DTESSERAE_BOARD_SEEED_EE05
    -DTESSERAE_OTA_CAPABILITY_ENABLED=1

board_build.partitions = partitions_ota.csv
board_build.flash_size = 16MB

; Driver-only bring-up (colour bars + hidden-column markers, no networking).
[env:seeed-ee05-selftest]
extends = env:seeed-ee05
build_flags =
    ${env:seeed-ee05.build_flags}
    -DEPD_SELFTEST

; -----------------------------------------------------------------------
; Seeed XIAO ePaper Display Board EE03 -- 10.3" ED103TC2 grayscale via an
; onboard IT8951E/DX (Family D). Same panel + controller as the reTerminal
; E1003, so it reuses it8951_gray unchanged; only the pin map differs
; (boards/seeed_ee03.h). XIAO ESP32-S3 Plus: 16 MB flash, 8 MB octal PSRAM.
; CS/EN sit on the UART0 pins, so the console moves to USB-Serial-JTAG.
; -----------------------------------------------------------------------
[env:seeed-ee03]
board = esp32-s3-devkitc1-n16r8
board_build.cmake_extra_args = -D SDKCONFIG_DEFAULTS="sdkconfig.usbjtag.defaults;sdkconfig.ble.defaults;sdkconfig.ota.defaults"

build_flags =
    -DTESSERAE_BOARD_SEEED_EE03
    -DTESSERAE_OTA_CAPABILITY_ENABLED=1

board_build.partitions = partitions_ota.csv
board_build.flash_size = 16MB

; Driver-only bring-up (gray ramp, no networking).
[env:seeed-ee03-selftest]
extends = env:seeed-ee03
build_flags =
    ${env:seeed-ee03.build_flags}
    -DEPD_SELFTEST

; -----------------------------------------------------------------------
; M5Stack PaperS3 -- 4.7" ED047TC1, 960x540, 16-level grey (Family F)
;
; NEW DRIVER FAMILY, and the first one that is not SPI. There is no controller
; between the MCU and the glass: parallel_epd_gray drives the source driver over
; the ESP32-S3's LCD/i80 bus and clocks the gate driver on SPV/CKV, with the
; greys coming from a per-level pass matrix in the board header rather than a
; controller's waveform flash. Adding another epdiy-class board (Inkplate,
; LilyGo T5, epdiy V7) after this is a pin map plus a matrix.
;
; The frame is the same 4bpp/W*H/2 shape the E1003 uses, so the server needed no
; new renderer -- only a catalog entry for kind m5stack_papers3.
;
; ESP32-S3R8: 16 MB flash, 8 MB OCTAL PSRAM, so the n16r8 tier stand-in fits
; exactly. Native USB, so the console goes to USB-Serial-JTAG.
;
; UNVERIFIED ON HARDWARE. Flash the -selftest env first and judge the 16 grey
; bands; the matrix in boards/m5stack_papers3.h is the tuning surface.
; -----------------------------------------------------------------------
[env:m5stack-papers3]
board = esp32-s3-devkitc1-n16r8
board_build.cmake_extra_args = -D SDKCONFIG_DEFAULTS="sdkconfig.usbjtag.defaults;sdkconfig.ota.defaults"

build_flags =
    -DTESSERAE_BOARD_M5STACK_PAPERS3
    -DTESSERAE_OTA_CAPABILITY_ENABLED=1

board_build.partitions = partitions_ota.csv
board_build.flash_size = 16MB

; Driver-only bring-up: 16 grey bands, black at the top to white at the bottom,
; no networking. Flash this first. Even spacing between the bands is the whole
; test -- two bands collapsing into one tone points at that level's row in the
; grey matrix, and a blank panel points at the power ramp or the row control.
[env:m5stack-papers3-selftest]
extends = env:m5stack-papers3
build_flags =
    ${env:m5stack-papers3.build_flags}
    -DEPD_SELFTEST

; -----------------------------------------------------------------------
; Xteink X4 -- 4.26" 800x480 mono, SSD1677 (Family E)
;
; No new driver: same controller/resolution/BUSY polarity as the Sticky, so it
; reuses ssd1677_gray via its 1bpp EPD_MONO path. Same 48000-byte frame as the
; E1001 / TRMNL mono boards, so the server needs no new renderer -- only a
; catalog entry for kind xteink_x4 with gamut mono.
;
; ESP32-C3: no PSRAM, 16 MB flash. Second C3 target, and the first with buttons
; -- the C3 has no ext1, so buttons.h grew a GPIO-wake backend.
;
; FLASHED APP-ONLY AT 0x10000, KEEPING THE FACTORY BOOTLOADER: a sealed reader
; with no exposed BOOT strap, so a device that will not enumerate needs the case
; opened. tools/upload_app_only.py enforces it, and partitions_xteink_x4.csv
; transcribes the stock table rather than designing one.
;
; TO FLASH: plug USB-C, tap the power button, `pio run -e xteink-x4 -t upload`.
; The tap matters -- in deep sleep the C3 powers down USB-Serial-JTAG and the
; port does not exist. Once awake it sees a USB host and loops instead of
; sleeping, so the port stays put.
;
; Verified on hardware. Later X4 runs ship a UC8179/UC8279 instead of the
; SSD1677 on the same board; those will not refresh and want their own target.
; -----------------------------------------------------------------------
[env:xteink-x4]
board = esp32-c3-devkitm-1
board_build.cmake_extra_args = -D SDKCONFIG_DEFAULTS="sdkconfig.c3-16m.defaults"

build_flags =
    -DTESSERAE_BOARD_XTEINK_X4
    -DTESSERAE_OTA_CAPABILITY_ENABLED=1

board_build.partitions = partitions_xteink_x4.csv
board_build.flash_size = 16MB
board_upload.flash_size = 16MB

; Keep the factory bootloader: app image only, at 0x10000.
extra_scripts = post:tools/upload_app_only.py

; Driver-only bring-up -- flash this first. Four bands starting BLACK, a white
; wedge top-left, and 1px stripes below (vertical = bit order, horizontal = row
; stride). Bands alone prove little; that is how the Sticky shipped a packing
; bug. Starting white means EPD_MONO_INVERT; wrong wedge corner means mirroring;
; nothing refreshing means BUSY polarity.
[env:xteink-x4-selftest]
extends = env:xteink-x4
build_flags =
    ${env:xteink-x4.build_flags}
    -DEPD_SELFTEST

; Deliberate full flash (bootloader + table + app), for converting a unit from
; stock or recovering a wrong table. Read partitions_xteink_x4.csv first: a bad
; table written here is what the app-only default exists to avoid.
[env:xteink-x4-full]
extends = env:xteink-x4
extra_scripts =
